<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKING</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="banner">
        <h2>BOOK YOUR TABLE NOW</h2>
        <div class="card-cont">
            <div class="card-img">
                
            </div>

            <div class="c-cont">
                <h3>Reservation</h3>
                <form>
                    <div class="f-row">
                        <select name="days">
                            <option value="day-select">Select Day</option>
                            <option value="sunday">Sunday</option>
                            <option value="monday">Monday</option>
                            <option value="tuesday">Tuesday</option>
                            <option value="wednesday">Wednesday</option>
                            <option value="friday">Friday</option>
                            <option value="saturday">Saturday</option>
                        </select>

                        <select name="hours">
                            <option value="hours-select">Select Hours</option>
                            <option value="10">10:00 am</option>
                            <option value="10">11:00 am</option>
                            <option value="10">12:00 pm</option>
                            <option value="10">1:00 pm</option>
                            <option value="10">3:00 pm</option>
                            <option value="10">5:00 pm</option>
                            <option value="10">7:00 pm</option>
                            <option value="10">9:00 pm</option>
                        </select>
                    </div>

                    <div class="f-row">
                        <input type="text" placeholder="Full Name">
                        <input type="text" placeholder="Phone Number">
                    </div>

                    <div class="f-row">
                        <input type="number" placeholder="How Many Person's?" min="1" >
                        <input type="submit" value="BOOK TABLE">
                    </div>
                </form>
            </div>
        </div>

    </section>
    
</body>
</html>
